version: '3.8'

# PurpleBilling - Complete Docker Compose Stack
# This file sets up the entire PurpleBilling infrastructure locally

services:
  # ==========================================================================
  # DATABASE - PostgreSQL 15
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: purplebilling-postgres
    environment:
      POSTGRES_DB: purplebilling
      POSTGRES_USER: purplebilling_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - purplebilling-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purplebilling_app -d purplebilling"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # CACHE - Redis 7
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: purplebilling-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - purplebilling-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # MESSAGE QUEUE - RabbitMQ 3
  # ==========================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: purplebilling-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-changeme}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    networks:
      - purplebilling-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # API - .NET 9 Application
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: ./infrastructure/docker/Dockerfile.api
    container_name: purplebilling-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=purplebilling;Username=purplebilling_app;Password=${DB_PASSWORD:-changeme}
      - Redis__Configuration=redis:6379,password=${REDIS_PASSWORD:-changeme}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=${RABBITMQ_USER:-admin}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-changeme}
      - Stripe__SecretKey=${STRIPE_SECRET_KEY}
      - PayPal__ClientId=${PAYPAL_CLIENT_ID}
      - PayPal__ClientSecret=${PAYPAL_CLIENT_SECRET}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - purplebilling-network
    volumes:
      - ./logs:/app/logs
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================================================================
  # FRONTEND - React Application
  # ==========================================================================
  frontend:
    build:
      context: .
      dockerfile: ./infrastructure/docker/Dockerfile.frontend
    container_name: purplebilling-frontend
    environment:
      - REACT_APP_API_URL=http://api:5000
      - REACT_APP_STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - purplebilling-network
    restart: unless-stopped

  # ==========================================================================
  # ADMIN DASHBOARD - React Application
  # ==========================================================================
  admin:
    build:
      context: .
      dockerfile: ./infrastructure/docker/Dockerfile.admin
    container_name: purplebilling-admin
    environment:
      - REACT_APP_API_URL=http://api:5000
    ports:
      - "3001:80"
    depends_on:
      - api
    networks:
      - purplebilling-network
    restart: unless-stopped

  # ==========================================================================
  # REVERSE PROXY - Nginx
  # ==========================================================================
  nginx:
    image: nginx:alpine
    container_name: purplebilling-nginx
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - frontend
      - admin
    networks:
      - purplebilling-network
    restart: unless-stopped

  # ==========================================================================
  # MONITORING - Prometheus
  # ==========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: purplebilling-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - purplebilling-network
    restart: unless-stopped

  # ==========================================================================
  # VISUALIZATION - Grafana
  # ==========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: purplebilling-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    networks:
      - purplebilling-network
    restart: unless-stopped

  # ==========================================================================
  # LOGGING - Elasticsearch
  # ==========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: purplebilling-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - purplebilling-network
    restart: unless-stopped

  # ==========================================================================
  # LOGGING - Kibana
  # ==========================================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: purplebilling-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - purplebilling-network
    restart: unless-stopped

  # ==========================================================================
  # LOGGING - Logstash
  # ==========================================================================
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: purplebilling-logstash
    volumes:
      - ./infrastructure/monitoring/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./logs:/logs:ro
    depends_on:
      - elasticsearch
    networks:
      - purplebilling-network
    restart: unless-stopped

  # ==========================================================================
  # WORKER - Background Job Processor
  # ==========================================================================
  worker:
    build:
      context: .
      dockerfile: ./infrastructure/docker/Dockerfile.worker
    container_name: purplebilling-worker
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=purplebilling;Username=purplebilling_app;Password=${DB_PASSWORD:-changeme}
      - Redis__Configuration=redis:6379,password=${REDIS_PASSWORD:-changeme}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=${RABBITMQ_USER:-admin}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-changeme}
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - purplebilling-network
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

# ==========================================================================
# NETWORKS
# ==========================================================================
networks:
  purplebilling-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ==========================================================================
# VOLUMES
# ==========================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  elasticsearch_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
